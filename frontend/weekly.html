<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  .wk{--wk-card:var(--surface);max-width:860px;margin:0 auto;padding:var(--sp-10) clamp(16px,4vw,32px) var(--sp-16);box-sizing:border-box;color:var(--text-primary)}
  .wk *{box-sizing:border-box}
  .wk a{color:var(--highlight-text)}
  .wk [hidden]{display:none !important}
  .wk-eyebrow{font:500 var(--fs-label)/var(--lh-label) var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin:0 0 var(--sp-2)}
  .wk-top{display:flex;flex-wrap:wrap;gap:var(--sp-4);align-items:flex-end;justify-content:space-between}
  .wk h1{font:500 var(--fs-h1)/var(--lh-h1) var(--font-display);letter-spacing:var(--ls-heading);margin:0}
  .wk-when{font-size:var(--fs-body);color:var(--text-secondary);margin:var(--sp-2) 0 0}
  .wk-state{display:inline-flex;align-items:center;height:22px;padding:0 var(--sp-2);font:500 var(--fs-label)/var(--lh-none) var(--font-sans);border-radius:var(--r-pill);margin-left:var(--sp-2);vertical-align:1px}
  .wk-state.is-draft{color:var(--warning);background:var(--warning-bg)} .wk-state.is-final{color:var(--highlight-text);background:var(--highlight-subtle)}
  .wk-pick select{font:400 var(--fs-input) var(--font-sans);padding:0 var(--sp-3);min-height:var(--control-h);border-radius:var(--r-control);border:1px solid var(--border);background:var(--surface-raised);color:var(--text-primary);max-width:100%}
  .wk-lead{margin:var(--sp-8) 0 0;padding:var(--card-pad);border-radius:var(--r-card);background:var(--wk-card);border:1px solid var(--border);box-shadow:none}
  .wk-lead h2{font:500 var(--fs-label)/var(--lh-label) var(--font-sans);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin:0 0 var(--sp-3)}
  .wk-lead p{font:400 var(--fs-h3)/var(--lh-body) var(--font-sans);margin:0 0 var(--sp-2)}
  .wk-lead p:last-child{margin:0}
  .wk-sec{margin:var(--sp-12) 0 0}
  .wk-sec > h2{font:500 var(--fs-h2)/var(--lh-h2) var(--font-display);letter-spacing:var(--ls-heading);margin:0 0 var(--sp-1)}
  .wk-sub{font-size:var(--fs-small);line-height:var(--lh-small);color:var(--text-muted);margin:0 0 var(--sp-4)}
  .wk-card{background:var(--wk-card);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
  .wk-t{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
  .wk-t th,.wk-t td{text-align:right;font-variant-numeric:tabular-nums}
  .wk-t th:first-child,.wk-t td:first-child{text-align:left}
  .wk-t tbody tr:last-child td{border-bottom:0}
  .wk-t tfoot td{font-weight:600;border-bottom:0;border-top:1px solid var(--border)}
  /* A rise and a fall: the colour, and always the arrow with it. */
  .up{color:var(--gain)} .dn{color:var(--loss)} .na{color:var(--text-muted)}
  .wk .up::before{content:"\25B2";display:inline-block;transform:scale(.72);transform-origin:left center;margin-right:2px;}
  .wk .dn::before{content:"\25BC";display:inline-block;transform:scale(.72);transform-origin:left center;margin-right:2px;}
  .wk-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--sp-2);margin:var(--sp-3) 0 var(--sp-1)}
  .wk-day{background:var(--wk-card);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--sp-3);font-size:var(--fs-small);min-width:0}
  .wk-day b{display:block;font:500 var(--fs-label)/var(--lh-none) var(--font-sans);color:var(--text-muted);margin-bottom:var(--sp-2);letter-spacing:var(--ls-label);text-transform:uppercase}
  .wk-day span{display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
  .wk-list{list-style:none;margin:0;padding:0 var(--card-pad)}
  .wk-list li{padding:var(--sp-4) 0;border-bottom:1px solid var(--border)}
  .wk-list li:last-child{border-bottom:0}
  .wk-meta{font-size:var(--fs-label);line-height:var(--lh-label);color:var(--text-muted);display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3)}
  .wk-imp{font-weight:600;text-transform:capitalize}
  .wk-imp.positive{color:var(--gain)} .wk-imp.negative{color:var(--loss)} .wk-imp.mixed{color:var(--text-primary)}
  .wk-imp.positive::before{content:"\25B2";display:inline-block;transform:scale(.72);transform-origin:left center;margin-right:2px;}
  .wk-imp.negative::before{content:"\25BC";display:inline-block;transform:scale(.72);transform-origin:left center;margin-right:2px;}
  .wk-title{font-weight:600;margin:var(--sp-1) 0 2px;line-height:var(--lh-label);overflow-wrap:anywhere}
  .wk-title a{color:var(--text-primary)}
  .wk-text{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text-secondary);margin:2px 0 0}
  .wk-chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-3) 0 0}
  .wk-chip{display:inline-flex;align-items:center;min-height:22px;font:500 var(--fs-label)/var(--lh-label) var(--font-sans);padding:0 var(--sp-2);border-radius:var(--r-pill);border:1px solid var(--border);color:var(--text-secondary);text-decoration:none}
  .wk a.wk-chip.is-stock{color:var(--text-primary);border-color:var(--border-strong)}
  .wk a.wk-chip.is-stock:hover{color:var(--highlight-text)}
  .wk-topic{background:var(--wk-card);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--card-pad);margin:0 0 var(--sp-3)}
  .wk-topic h3{font:600 var(--fs-h3)/var(--lh-h3) var(--font-sans);margin:0 0 var(--sp-3);overflow-wrap:anywhere}
  .wk-body{font-size:var(--fs-body);line-height:var(--lh-body);overflow-wrap:anywhere}
  .wk-body p{margin:0 0 var(--sp-3)} .wk-body ul{margin:0 0 var(--sp-3);padding-left:20px}
  .wk-body > :last-child{margin-bottom:0}
  .wk-empty{color:var(--text-muted);font-size:var(--fs-body);padding:var(--sp-3) 0}
  .wk-note{margin:var(--sp-12) 0 0;padding:var(--sp-3) var(--sp-4);border:1px solid var(--border);background:var(--wk-card);border-radius:var(--r-card);font-size:var(--fs-small);line-height:var(--lh-body);color:var(--text-secondary)}
  .wk-ask{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;justify-content:space-between;margin:var(--sp-4) 0 0;padding:var(--sp-4) var(--card-pad);border:1px solid var(--border);border-radius:var(--r-card)}
  .wk-ask p{margin:0;font-size:var(--fs-body);color:var(--text-secondary)}
  /* The secondary button; .is-gold is the one filled action (the editor's). */
  .wk-btn{display:inline-flex;align-items:center;justify-content:center;font:500 var(--fs-body)/var(--lh-none) var(--font-sans);padding:0 var(--sp-5);min-height:var(--control-h);border-radius:var(--r-control);border:1px solid var(--border-strong);background:transparent;color:var(--text-primary) !important;text-decoration:none;cursor:pointer}
  .wk-btn:hover{background:var(--surface-raised)}
  .wk-btn.is-gold{background:var(--accent);border-color:transparent;border-radius:var(--r-pill);color:var(--on-accent) !important}
  .wk-btn.is-gold:hover{background:var(--accent-hover)}
  .wk-btn.is-small{padding:0 var(--sp-3);min-height:32px;font-size:var(--fs-small)}
  .wk-edit{margin:var(--sp-4) 0 0;display:grid;gap:var(--sp-3);padding:var(--card-pad);border:1px solid var(--border);border-radius:var(--r-card);background:var(--wk-card)}
  .wk-edit label{display:grid;gap:var(--sp-2);font-size:var(--fs-small);font-weight:500}
  .wk-edit input,.wk-edit textarea{font:400 var(--fs-input) var(--font-sans);padding:12px 12px;border-radius:var(--r-control);border:1px solid var(--border);background:var(--surface-raised);color:var(--text-primary);width:100%}
  .wk-edit textarea{min-height:160px;line-height:var(--lh-body);resize:vertical}
  .wk-msg{font-size:var(--fs-body);margin:0}
  .wk-msg:empty{display:none}
  .wk-msg.is-err{color:var(--loss)}
  .wk-msg blockquote{margin:var(--sp-2) 0 0;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-control);background:var(--loss-bg)}
  .wk-loading{color:var(--text-muted);padding:var(--sp-8) 0}
  @media (max-width:560px){.wk-days{gap:var(--sp-1)}.wk-day{padding:var(--sp-2) var(--sp-1);font-size:var(--fs-label)}.wk-t th,.wk-t td{padding:0 var(--sp-3)}}
</style>
</head>
<body>
<main class="wk" id="wk">
  <div class="wk-top">
    <div>
      <p class="wk-eyebrow">Altaha · weekly brief</p>
      <h1>The week in brief</h1>
      <p class="wk-when" id="wk-when"></p>
    </div>
    <label class="wk-pick"><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Choose a week</span>
      <select id="wk-weeks" aria-label="Choose a week"><option value="">This week so far</option></select></label>
  </div>
  <div id="wk-body" aria-live="polite"><p class="wk-loading">Loading the brief. If the site has been idle this takes about thirty seconds.</p></div>
</main>

<script src="shell.js?v=20261124-logos" defer></script>
<script>
(function () {
  'use strict';
  var API = (typeof API_BASE !== 'undefined' && API_BASE) ? API_BASE : 'https://taha-project.onrender.com';
  var ADMIN_STORE = 'altaha-admin-key';
  var body = document.getElementById('wk-body'), pick = document.getElementById('wk-weeks');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function param(k) { try { return new URLSearchParams(location.search).get(k) || ''; } catch (e) { return ''; } }
  function num(v, d) { return v == null ? '–' : Number(v).toLocaleString('en-IN', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function pct(v) {
    if (v == null) return '<span class="na">–</span>';
    return '<span class="' + (v > 0 ? 'up' : v < 0 ? 'dn' : 'na') + '">' + (v > 0 ? '+' : '') + v.toFixed(2) + '%</span>';
  }
  function cr(v) {
    if (v == null) return '<span class="na">not recorded</span>';
    return '<span class="' + (v > 0 ? 'up' : v < 0 ? 'dn' : 'na') + '">' + (v > 0 ? '+' : '') + num(v) + '</span>';
  }
  function adminKey() { try { return localStorage.getItem(ADMIN_STORE) || ''; } catch (e) { return ''; } }
  function editing() { return !!adminKey() || param('edit') === '1'; }

  /* A topic is the owner's text: escaped, then paragraphs, "- " lines as a
     list, and http(s) addresses as links. Never read as markup. */
  function bodyHTML(text) {
    function links(s) {
      return s.replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g, function (u) {
        return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
      });
    }
    return String(text || '').split(/\n{2,}/).map(function (para) {
      var lines = para.split('\n');
      if (lines.every(function (l) { return /^\s*[-•]\s+/.test(l); })) {
        return '<ul>' + lines.map(function (l) { return '<li>' + links(esc(l.replace(/^\s*[-•]\s+/, ''))) + '</li>'; }).join('') + '</ul>';
      }
      return '<p>' + links(esc(para)).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function section(title, sub, inner) {
    return '<section class="wk-sec"><h2>' + esc(title) + '</h2>' + (sub ? '<p class="wk-sub">' + esc(sub) + '</p>' : '') + inner + '</section>';
  }

  function marketHTML(m) {
    if (!m || !m.indices || !m.indices.length) return '';
    var rows = m.indices.map(function (r) {
      return '<tr><td>' + esc(r.index) + '</td><td>' + num(r.close, 2) + '</td><td>' + pct(r.week_change_pct) + '</td></tr>';
    }).join('');
    var days = (m.sessions || []).length ? '<div class="wk-days" aria-label="Nifty, session by session">' + m.sessions.map(function (s) {
      return '<div class="wk-day"><b>' + esc(s.weekday) + '</b><span>' + num(s.close) + '</span><span>' + pct(s.change_pct) + '</span></div>';
    }).join('') + '</div>' : '';
    return section('The market', 'Each index at the end of the week, against the end of the week before. Then Nifty, session by session.',
      '<div class="wk-card"><table class="wk-t"><thead><tr><th>Index</th><th>Close</th><th>On the week</th></tr></thead><tbody>' + rows + '</tbody></table></div>' + days);
  }

  function flowsHTML(f) {
    if (!f || !f.recorded) return '';
    var rows = f.sessions.map(function (s) {
      return '<tr><td>' + esc(s.weekday) + '</td><td>' + cr(s.fii) + '</td><td>' + cr(s.dii) + '</td></tr>';
    }).join('');
    return section('Money flow', f.source + (f.recorded < f.of ? '. ' + f.recorded + ' of ' + f.of + ' sessions on record.' : '.'),
      '<div class="wk-card"><table class="wk-t"><thead><tr><th>Session</th><th>FII net</th><th>DII net</th></tr></thead><tbody>' + rows +
      '</tbody><tfoot><tr><td>The week</td><td>' + cr(f.fii_total) + '</td><td>' + cr(f.dii_total) + '</td></tr></tfoot></table></div>');
  }

  function policyHTML(p) {
    if (!p || !p.items || !p.items.length) return '';
    var items = p.items.map(function (r) {
      var title = r.link && /^https?:\/\//.test(r.link) ? '<a href="' + esc(r.link) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a>' : esc(r.title);
      var stocks = (r.stocks || []).map(function (s) {
        return '<a class="wk-chip is-stock" href="stock.html?ticker=' + encodeURIComponent(s.symbol) + '">' + esc(s.symbol) + ' ' + esc(s.direction) + '</a>';
      }).join('');
      return '<li><div class="wk-meta"><span>' + esc(r.source) + (r.number ? ' ' + esc(r.number) : '') + '</span>' +
        '<span class="wk-imp ' + esc(r.impact) + '">' + esc(r.impact) + '</span>' +
        ((r.sectors || []).length ? '<span>' + esc(r.sectors.join(', ')) + '</span>' : '') + '</div>' +
        '<div class="wk-title">' + title + '</div>' + (r.summary && r.summary !== r.title ? '<p class="wk-text">' + esc(r.summary) + '</p>' : '') +
        (stocks ? '<div class="wk-chips">' + stocks + '</div>' : '') + '</li>';
    }).join('');
    return section('New rules that matter', p.matter + ' of ' + p.read + ' circulars read this week touch listed companies. A judgement, not a measurement.',
      '<div class="wk-card"><ul class="wk-list">' + items + '</ul></div><p class="wk-sub" style="margin-top:8px"><a href="brief.html">Every circular, day by day ›</a></p>');
  }

  function forumHTML(f) {
    if (!f || !f.threads || !f.threads.length) {
      return section('On the forum', '', '<div class="wk-ask"><p>Nobody posted on the forum this week. Be the first.</p>' +
        '<a class="wk-btn" href="forum.html">Open the forum</a></div>');
    }
    var threads = f.threads.map(function (t) {
      return '<li><div class="wk-meta"><span>' + esc(t.category_label) + '</span>' + (t.symbol ? '<span>' + esc(t.symbol) + '</span>' : '') +
        '<span>' + t.posts + ' posts this week</span></div><div class="wk-title"><a href="forum.html#t/' + encodeURIComponent(t.id) + '">' + esc(t.title) + '</a></div></li>';
    }).join('');
    var stocks = (f.stocks || []).map(function (s) {
      return '<a class="wk-chip is-stock" href="forum.html#stock/' + encodeURIComponent(s.symbol) + '">' + esc(s.symbol) + ' · ' + s.posts + '</a>';
    }).join('');
    return section('On the forum', f.posts + ' posts from ' + f.members + ' members, ' + f.new_threads + ' new discussions. Members’ opinions, not advice.',
      '<div class="wk-card"><ul class="wk-list">' + threads + '</ul></div>' +
      (stocks ? '<p class="wk-sub" style="margin:12px 0 0">Most talked-about stocks</p><div class="wk-chips">' + stocks + '</div>' : ''));
  }

  function topicsHTML(d) {
    var list = (d.topics || []).map(function (t) {
      var syms = (t.symbols || []).map(function (s) {
        return '<a class="wk-chip is-stock" href="stock.html?ticker=' + encodeURIComponent(s) + '">' + esc(s) + '</a>';
      }).join('');
      return '<article class="wk-topic" id="topic-' + esc(t.id) + '"><h3>' + esc(t.title) + '</h3><div class="wk-body">' + bodyHTML(t.body) + '</div>' +
        (syms ? '<div class="wk-chips">' + syms + '</div>' : '') +
        (editing() ? '<p style="margin:10px 0 0"><button type="button" class="wk-btn is-small" data-del="' + esc(t.id) + '">Remove this topic</button></p>' : '') +
        '</article>';
    }).join('');
    var ask = '<div class="wk-ask"><p>A subject you would like the brief to cover?</p>' +
      '<a class="wk-btn" href="forum.html#new/c/altaha">Suggest a topic</a></div>';
    var editor = editing() ? '<form class="wk-edit" id="wk-edit" novalidate>' +
      '<label>Topic title<input id="wk-e-title" maxlength="120" placeholder="e.g. What the budget could change for banks"></label>' +
      '<label>What you want to say<textarea id="wk-e-body" maxlength="8000" placeholder="Plain text. A blank line starts a paragraph; lines starting with - become a list."></textarea></label>' +
      '<label>Stocks it mentions (optional)<input id="wk-e-syms" placeholder="HDFCBANK, ICICIBANK"></label>' +
      '<div><button class="wk-btn is-gold" type="submit">Add to ' + esc(d.label) + '</button></div>' +
      '<p class="wk-msg" id="wk-e-msg" role="status"></p></form>' : '';
    if (!list && !editing()) return section('This week’s topics', '', ask);
    return section('This week’s topics', 'Notes from Altaha on whatever mattered this week.', list + editor + ask);
  }

  function render(d) {
    var state = d.published ? '<span class="wk-state is-final">Published</span>' : d.draft ? '<span class="wk-state is-draft">So far</span>' : '';
    document.getElementById('wk-when').innerHTML = esc(d.label) + state;
    document.title = 'Weekly brief, ' + d.label + ' | Altaha Screener';
    var lead = (d.summary || []).length
      ? '<div class="wk-lead"><h2>In brief</h2>' + d.summary.map(function (s) { return '<p>' + esc(s) + '</p>'; }).join('') + '</div>'
      : '<div class="wk-lead"><h2>In brief</h2><p>Nothing recorded for this week yet.</p></div>';
    // Topics lead when there are any; with none, the invitation to suggest one waits at the end.
    var topics = topicsHTML(d), first = (d.topics || []).length || editing();
    body.innerHTML = lead + (first ? topics : '') + marketHTML(d.market) + flowsHTML(d.flows) + policyHTML(d.policy) + forumHTML(d.forum) +
      (first ? '' : topics) +
      '<p class="wk-note">' + esc(d.note) + (d.draft ? ' This week is still going: the figures fill in as the week trades, and the issue is fixed on Saturday morning.' : '') + '</p>';
    wireEditor(d);
  }

  function wireEditor(d) {
    var form = document.getElementById('wk-edit');
    function key() {
      var k = adminKey();
      if (!k) {
        k = window.prompt('Admin key (ADMIN_KEY on Render)') || '';
        try { if (k) localStorage.setItem(ADMIN_STORE, k); } catch (e) {}
      }
      return k;
    }
    function send(payload) {
      return fetch(API + '/admin/weekly/topics', { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key() },
        body: JSON.stringify(Object.assign({ week: d.week }, payload)) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) { var e = new Error((j.detail && j.detail.message) || j.detail || 'Not saved.'); e.sentence = j.detail && j.detail.sentence; throw e; }
          return j;
        }); });
    }
    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('wk-e-msg');
      msg.className = 'wk-msg'; msg.textContent = 'Saving…';
      send({ action: 'add', title: document.getElementById('wk-e-title').value, body: document.getElementById('wk-e-body').value,
             symbols: document.getElementById('wk-e-syms').value })
        .then(function () { load(d.published || !d.draft ? d.week : ''); }, function (err) {
          msg.className = 'wk-msg is-err';
          msg.innerHTML = esc(err.message) + (err.sentence ? '<blockquote>' + esc(err.sentence) + '</blockquote>' : '');
        });
    });
    body.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!window.confirm('Remove this topic from the brief?')) return;
        send({ action: 'delete', id: b.dataset.del }).then(function () { load(d.published || !d.draft ? d.week : ''); },
          function (err) { alert(err.message); });
      });
    });
  }

  var opened = false;
  function load(week) {
    fetch(API + '/weekly' + (week ? '?week=' + encodeURIComponent(week) : ''))
      .then(function (r) { return r.ok ? r.json() : r.json().then(function (j) { throw new Error(j.detail || 'down'); }, function () { throw new Error('down'); }); })
      .then(function (d) {
        render(d);
        if (!opened && window.AltahaTrack) {
          opened = true;
          window.AltahaTrack('weekly_brief_opened', { week: d.week, from: (param('from') || 'direct').replace(/[^a-z]/g, '').slice(0, 20) });
        }
      }, function (err) {
        body.innerHTML = '<p class="wk-empty">' + (err.message && err.message !== 'down' ? esc(err.message) : 'The brief could not be loaded. Try again in a moment.') + '</p>';
      });
  }

  function start() {
    var want = /^\d{4}-W\d{2}$/.test(param('w')) ? param('w') : '';
    fetch(API + '/weekly/issues').then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d) return;
      (d.issues || []).forEach(function (i) {
        if (i.week === d.current) return;            // this week is the first option
        var o = document.createElement('option');
        o.value = i.week; o.textContent = i.label;
        pick.appendChild(o);
      });
      if (want && want !== d.current) {
        if (![].some.call(pick.options, function (o) { return o.value === want; })) {
          var o = document.createElement('option'); o.value = want; o.textContent = want; pick.appendChild(o);
        }
        pick.value = want;
      }
    }).catch(function () {});
    pick.addEventListener('change', function () {
      try { history.replaceState(null, '', location.pathname + (pick.value ? '?w=' + pick.value : '')); } catch (e) {}
      load(pick.value);
    });
    load(want);
  }
  window.AltahaWeekly = { bodyHTML: bodyHTML };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
