<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" /><script src="clean-url.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="theme.js"></script>
<link rel="preload" as="font" type="font/woff2" href="fonts/inter-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/fraunces-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/jetbrains-mono-latin.woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<title>Daily brief | Altaha Screener</title>
<meta name="description" content="Every new DGFT, RBI, SEBI and government circular, with what it changes and which Indian sectors and stocks it touches." />
<link rel="canonical" href="https://altahascreener.in/brief" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="stylesheet" href="altaha-polish.css">
<link rel="stylesheet" href="altaha-skin.css">
<link rel="stylesheet" href="type.css">
<link rel="stylesheet" href="components.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); }
  .bf { max-width: 780px; margin: 0 auto; padding: var(--sp-8) var(--gutter) var(--sp-16); }
  .bf a { color: inherit; }
  .bf-top { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
  .bf-top a { font-size: var(--fs-small); color: var(--text-secondary); text-decoration: none; }
  .bf-top a:hover { color: var(--highlight-text); }
  .bf-top .bf-sub { margin: 0; font-size: var(--fs-small); color: var(--text-muted); }
  .bf h1 { font-family: var(--font-display); font-weight: 500; font-size: var(--fs-h1); line-height: var(--lh-h1); margin: var(--sp-6) 0 var(--sp-2); letter-spacing:var(--ls-heading); }
  .bf-sub { color: var(--text-secondary); font-size: var(--fs-body); margin: 0 0 var(--sp-3); line-height: var(--lh-body); }
  .bf-sub a { color: var(--highlight-text); }
  /* The period is a row of underline tabs: cognac and a 2px line when chosen. */
  .bf-days { display: flex; gap: var(--sp-6); margin: var(--sp-6) 0; border-bottom: 1px solid var(--border); }
  .bf-days button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--text-secondary); border-radius: 0; padding: var(--sp-3) 0; font: 500 var(--fs-body)/var(--lh-none) var(--font-sans); cursor: pointer; min-height: 40px; }
  .bf-days button:hover { color: var(--text-primary); }
  .bf-days button.on { color: var(--highlight-text); border-bottom-color: var(--highlight); }
  .bf-note { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); color: var(--text-secondary); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-small); line-height: var(--lh-small); margin: 0 0 var(--sp-6); }
  .bf-sum { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0 0 var(--sp-6); }
  .bf-chip { display: inline-flex; align-items: center; min-height: 22px; border-radius: var(--r-pill); padding: 0 var(--sp-2); font: 500 var(--fs-label)/var(--lh-label) var(--font-sans); background: var(--wash-strong); color: var(--text-secondary); }
  .bf-chip b { font-weight: 600; margin-right: var(--sp-1); }
  /* Helped and hurt are data: the colour always comes with its arrow. */
  .bf-chip.positive { background: var(--gain-bg); color: var(--gain); }
  .bf-chip.negative { background: var(--loss-bg); color: var(--loss); }
  .bf-imp.positive, .bf-st.helped { color: var(--gain); }
  .bf-imp.negative, .bf-st.hurt { color: var(--loss); }
  .bf-chip.positive::before, .bf-imp.positive::before, .bf-st.helped::before { content:"\25B2";display:inline-block;transform:scale(.72);transform-origin:left center;margin-right:2px;}
  .bf-chip.negative::before, .bf-imp.negative::before, .bf-st.hurt::before { content:"\25BC";display:inline-block;transform:scale(.72);transform-origin:left center;margin-right:2px;}
  .bf-imp.mixed { color: var(--text-primary); }
  .bf h2 { font: 500 var(--fs-label)/var(--lh-label) var(--font-sans); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--text-muted); margin: var(--sp-8) 0 var(--sp-2); }
  .bf-item { border-top: 1px solid var(--border); padding: var(--sp-4) 0; }
  .bf-meta { font-size: var(--fs-label); line-height: var(--lh-label); color: var(--text-muted); display: flex; gap: var(--sp-2) var(--sp-3); flex-wrap: wrap; }
  .bf-imp { font-weight: 600; text-transform: capitalize; }
  .bf-title { font-size: var(--fs-h3); font-weight: 600; margin: var(--sp-2) 0; line-height: var(--lh-h3); overflow-wrap: anywhere; }
  .bf-text { font-size: var(--fs-body); line-height: var(--lh-body); margin: var(--sp-2) 0; }
  .bf-why { font-size: var(--fs-body); line-height: var(--lh-body); color: var(--text-secondary); margin: var(--sp-2) 0; }
  .bf-why b { font-weight: 600; color: var(--text-primary); }
  .bf-stocks { list-style: none; padding: 0; margin: var(--sp-2) 0 0; font-size: var(--fs-body); line-height: var(--lh-body); }
  .bf-stocks b { font-weight: 600; }
  .bf-st { font-weight: 600; }
  .bf-quiet { color: var(--text-secondary); font-size: var(--fs-body); padding: var(--sp-4) 0; }
  details.bf-rest { margin-top: var(--sp-6); border-top: 1px solid var(--border); }
  details.bf-rest summary { cursor: pointer; font-size: var(--fs-body); padding: var(--sp-3) 0; color: var(--text-secondary); }
  details.bf-rest .bf-item:first-of-type { border-top: 0; }
</style>
</head>
<body>
<main class="bf">
  <div class="bf-top"><a href="./">&larr; Altaha Screener</a><span class="bf-sub" id="bf-when"></span></div>
  <h1>Daily brief</h1>
  <p class="bf-sub">Every new circular from DGFT, RBI, SEBI and the government press office, read for what it does to listed companies.</p>
  <p class="bf-sub"><a href="weekly.html?from=brief">The whole week in one page: the weekly brief &rsaquo;</a></p>
  <div class="bf-days" role="tablist" aria-label="Period">
    <button type="button" data-days="1" class="on">Today</button>
    <button type="button" data-days="3">3 days</button>
    <button type="button" data-days="7">7 days</button>
  </div>
  <div id="bf-body" aria-live="polite"><p class="bf-quiet">Loading the brief. If the site has been idle this takes about thirty seconds.</p></div>
</main>
<script>
var API_BASE = "https://taha-project.onrender.com";
(function () {
  "use strict";
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function day(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? Number(m[3]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(m[2]) - 1] : ""; }
  function item(r) {
    var stocks = (r.stocks || []).map(function (s) {
      return "<li><a href=\"stock.html?ticker=" + encodeURIComponent(s.symbol) + "\"><b>" + esc(s.symbol) + "</b></a> <span class=\"bf-st " + esc(s.direction) + "\">" + esc(s.direction) + "</span>: " + esc(s.reason) + "</li>";
    }).join("");
    var title = r.link ? "<a href=\"" + esc(r.link) + "\" target=\"_blank\" rel=\"noopener\">" + esc(r.title) + "</a>" : esc(r.title);
    return "<div class=\"bf-item\"><div class=\"bf-meta\"><span>" + esc(r.source) + (r.number ? " " + esc(r.number) : "") + "</span><span>" + esc(day(r.date)) + "</span>" +
      "<span class=\"bf-imp " + esc(r.impact) + "\">" + esc(r.impact === "none" ? "no market effect" : r.impact) + "</span>" +
      "<span>" + (r.read_by === "claude" ? "read by Claude from " + esc(r.read_from || "the title") : "read by keywords") + "</span></div>" +
      "<div class=\"bf-title\">" + title + "</div>" +
      (r.summary && r.summary !== r.title ? "<p class=\"bf-text\">" + esc(r.summary) + "</p>" : "") +
      (r.sectors && r.sectors.length ? "<p class=\"bf-why\"><b>Sectors:</b> " + esc(r.sectors.join(", ")) + "</p>" : "") +
      (r.why ? "<p class=\"bf-why\">" + esc(r.why) + "</p>" : "") +
      (stocks ? "<ul class=\"bf-stocks\">" + stocks + "</ul>" : "") +
      (r.watch ? "<p class=\"bf-why\"><b>Watch:</b> " + esc(r.watch) + "</p>" : "") + "</div>";
  }
  function render(d) {
    var body = document.getElementById("bf-body");
    if (!d) { body.innerHTML = "<p class=\"bf-quiet\">The brief could not be loaded. Try again in a moment.</p>"; return; }
    document.getElementById("bf-when").textContent = d.last_run ? "Last read " + d.last_run.at + " IST" : "Not read yet";
    var matter = (d.items || []).filter(function (r) { return ["positive", "negative", "mixed"].indexOf(r.impact) !== -1; });
    var rest = (d.items || []).filter(function (r) { return matter.indexOf(r) === -1; });
    var out = "<p class=\"bf-note\">" + esc(d.note) + (d.reader === "keywords" ? " Today\u2019s circulars were read by a keyword table, which names sectors but no stocks." : "") + "</p>";
    if (!d.count) {
      out += "<p class=\"bf-quiet\">" + (d.last_run ? "No new circular in this period." : "The brief has not run yet. It reads the sources three times each weekday.") + "</p>";
      body.innerHTML = out; return;
    }
    var chips = (d.sectors || []).map(function (s) {
      var tone = s.positive && !s.negative ? "positive" : s.negative && !s.positive ? "negative" : "";
      return "<span class=\"bf-chip " + tone + "\">" + esc(s.sector) + "</span>";
    }).concat((d.stocks || []).map(function (s) {
      var dir = s.mentions[0].direction;
      return "<span class=\"bf-chip " + (dir === "helped" ? "positive" : "negative") + "\"><b>" + esc(s.symbol) + "</b> " + esc(dir) + "</span>";
    })).join("");
    if (chips) out += "<div class=\"bf-sum\">" + chips + "</div>";
    out += "<h2>" + matter.length + " that matter" + (matter.length === 1 ? "s" : "") + "</h2>" +
      (matter.length ? matter.map(item).join("") : "<p class=\"bf-quiet\">None of the " + d.count + " circulars read in this period changes anything for a listed company.</p>");
    if (rest.length) out += "<details class=\"bf-rest\"><summary>" + rest.length + " more read, with no clear market effect</summary>" + rest.map(item).join("") + "</details>";
    body.innerHTML = out;
  }
  function load(days) {
    fetch(API_BASE + "/brief?days=" + days).then(function (r) { return r.ok ? r.json() : null; }).then(render).catch(function () { render(null); });
  }
  document.querySelectorAll(".bf-days button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".bf-days button").forEach(function (x) { x.classList.toggle("on", x === b); });
      load(b.dataset.days);
    });
  });
  window.AltahaBrief = { render: render };
  load(1);
})();
</script>
</body>
</html>
