name: Daily portfolio digest

# The fallback, not the clock.
#
# The API sends the digest itself at 17:45 IST (backend/main.py, "The daily
# send, on time"). This workflow asks for it as well, three times a day,
# because the process that keeps that time restarts on every deploy and a
# timer nobody watches is a job that silently stops. Whoever asks second
# finds everybody already mailed and sends nothing. When a run here is the
# one that sends, it says so in a warning: that is the sign the API's own
# clock did not.
#
# This used to be the only thing that started the send, once, at 12:15 UTC
# (17:45 IST). GitHub starts a scheduled run when it has room. Across
# November 2026 that run started between 19:30 and 22:00 UTC every night,
# 01:00 to 03:30 in India. At that hour the index feed ended on the session
# before the one that had closed, so the email arrived in the small hours
# describing the day before.
#
# Hence three times. The API refuses any call that is not on the evening of a
# session (before 17:45 IST, after midnight, a holiday, a weekend) and says
# why, so an early or a late run costs nothing, and one of the three lands in
# the evening whether GitHub is seven to ten hours behind, as it has been, or
# on time:
#
#   04:15 UTC  on time 09:45 IST, refused.  Seven to ten hours late: 16:45 to 19:45 IST.
#   08:15 UTC  on time 13:45 IST, refused.  Seven to ten hours late: 20:45 to 23:45 IST.
#   12:45 UTC  on time 18:15 IST, half an hour after the API's own send.
#
# Needs one repository secret: ALTAHA_ADMIN_KEY, the same value as ADMIN_KEY
# on Render. Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: "15 4 * * 1-5"
    - cron: "15 8 * * 1-5"
    - cron: "45 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every digest but send nothing"
        type: boolean
        default: false

permissions:
  contents: read

# Two of the three can be started close together when GitHub catches up on a
# backlog. One at a time; the API would turn the second away as busy anyway.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ask the API to send today's digests, if they have not gone
        env:
          ADMIN_KEY: ${{ secrets.ALTAHA_ADMIN_KEY }}
          API: https://taha-project.onrender.com
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_KEY}" ]; then
            echo "::error::ALTAHA_ADMIN_KEY is not set — nothing was sent."
            exit 1
          fi

          # A free-tier instance can be asleep, and the first request pays for
          # waking it. Warm it, then send, and let curl retry the wake rather
          # than counting a cold start as a failed digest.
          curl -sS --max-time 90 --retry 3 --retry-delay 10 \
               --retry-all-errors -o /dev/null "${API}/health" || true

          code=$(curl -sS --max-time 600 -o response.json -w "%{http_code}" \
                 -X POST "${API}/jobs/daily-digest?dry_run=${DRY}" \
                 -H "X-Admin-Key: ${ADMIN_KEY}")

          echo "HTTP ${code}"
          cat response.json
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::The digest job returned ${code}."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          d = json.load(open("response.json"))
          print(f"at={d.get('at')} session={d.get('session')} feed_date={d.get('feed_date')} "
                f"recipients={d.get('recipients')} sent={d.get('sent')} "
                f"skipped={d.get('skipped')} failed={d.get('failed')}")
          if d.get("busy"):
              print("Another run is sending right now. Nothing to do here.")
          elif d.get("due") is False and not d.get("dry_run"):
              # Most runs end here, by design: see the note at the top.
              print(f"Nothing is due now: {d.get('reason')}")
          if d.get("provider") == "console":
              print("::warning::No email provider is configured — "
                    "digests were logged, not delivered.")
          # This run is the fallback. If it is the one that mailed people, the
          # API's own 17:45 IST send did not happen, and that wants a look
          # before the day the fallback is late as well.
          if d.get("sent") and not d.get("dry_run"):
              print(f"::warning::This run sent {d['sent']} digest(s). The API should have sent "
                    "them itself at 17:45 IST and did not. Open /health and read \"digest\": "
                    "is the clock on and running, and what did its last run say?")
          # A run that fails to send to somebody is a run that needs looking
          # at, even though the others went out.
          if d.get("failed"):
              print(f"::error::{d['failed']} digest(s) failed to send.")
              sys.exit(1)
          PY
