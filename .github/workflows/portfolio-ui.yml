name: Portfolio UI
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/portfolio*.py'
      - 'backend/shareholding_filings.py'
      - 'backend/wow_orders.py'
      - 'backend/concalls.py'
      - 'backend/filings_text.py'
      - 'backend/tests/*portfolio*'
      - 'backend/tests/*shareholding*'
      - 'backend/tests/*wow*'
      - 'backend/tests/*concall*'
      - '.github/workflows/portfolio-ui.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install numpy pandas
          npm install --prefix /tmp/portfolio-browser playwright@1.58.2
          /tmp/portfolio-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build synthetic portfolio fixtures
        run: python backend/tests/portfolio_fixture.py /tmp/portfolio-fixtures
      - name: Verify phone, tablet, desktop and chart failures
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-verification
          path: test-results/portfolio
      - name: Verify homepage visuals, motion and accessibility
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/home-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-browser-verification
          path: test-results/home
      - name: Verify the ownership pane does not double-count public holding
        if: always()
        # The one failure mode worth a browser for: in the exchange's format
        # Public CONTAINS the FII and DII lines, so a chart of all four
        # overstates the company by about half. This asserts on the rendered
        # bar and rows, not on the payload.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-ownership-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-browser-verification
          path: test-results/ownership
      - name: Verify WOW orders and concall digests
        if: always()
        # The two failure modes worth a browser: an order the company never
        # priced must never render as zero, and a quoted line must never
        # appear without the name of who said it.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/filings-views-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filings-views-verification
          path: test-results/filings-views
      - name: Verify sign-in failures and link completion on phone and desktop
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/signin-browser.cjs
