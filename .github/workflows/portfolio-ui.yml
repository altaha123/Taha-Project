name: Portfolio UI
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/portfolio*.py'
      - 'backend/action_plan.py'
      - 'backend/advisor*.py'
      - 'backend/shareholding_filings.py'
      - 'backend/wow_orders.py'
      - 'backend/concalls.py'
      - 'backend/filings_text.py'
      - 'backend/strategy_lab.py'
      - 'backend/wealth*.py'
      - 'backend/company_pages.py'
      - 'backend/stock_page.py'
      - 'backend/stock_news.py'
      - 'backend/announcements.py'
      - 'backend/tests/company_pages*'
      - 'backend/tests/make_stock_page_fixture.py'
      - 'backend/tests/*wealth*'
      - 'backend/tests/*portfolio*'
      - 'backend/tests/*shareholding*'
      - 'backend/tests/*wow*'
      - 'backend/tests/*concall*'
      - '.github/workflows/portfolio-ui.yml'
permissions:
  contents: read
jobs:
  browser:
    # Pinned, not ubuntu-latest: the day that label moved to Ubuntu 26.04,
    # Playwright 1.58.2 refused to install Chromium there and this job
    # failed before running a single test. Move this and the Playwright
    # version together.
    runs-on: ubuntu-24.04
    # The tests take about seven minutes. Installing Chromium and its system
    # packages usually takes one and has taken eleven and a half, and at
    # fifteen that cancelled a run in which every test had passed.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install numpy pandas
          npm install --prefix /tmp/portfolio-browser playwright@1.58.2
          /tmp/portfolio-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build synthetic portfolio fixtures
        run: python backend/tests/portfolio_fixture.py /tmp/portfolio-fixtures
      - name: Verify phone, tablet, desktop and chart failures
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-browser.cjs
      - name: Verify the portfolio story reads, turns, keeps its place and respects motion-off
        if: always()
        # The review opens as a story; the full report stays closed until
        # asked for and opens with its charts drawn. Staged updates keep the
        # reader's chapter; with reduced motion nothing animates or hides.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-story-browser.cjs
      - name: Verify the action plan answers "what do I do" first, filters, links and respects motion-off
        if: always()
        # A call on every holding, most urgent first, each with its trade and
        # reason; switches and industries link to real stock pages; the
        # not-SEBI-registered disclaimer is on the page; story and full report
        # stay closed until asked for.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-plan-browser.cjs
      - name: Verify the Pro waitlist sends what it says, and saved screens sync
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/pro-browser.cjs
      - name: Verify Advisors finds people, chats live, refuses with a reason, and keeps markup as text
        if: always()
        # A chat starts with what the reader chose, a reply arrives by polling,
        # a refused message keeps its draft, the adviser sees only what was
        # shared, an educator cannot take portfolio reviews, and sign-in
        # returns here but never to another site.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/advisors-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-and-pro-screenshots
          path: |
            test-results/portfolio-story
            test-results/portfolio-plan
            test-results/advisors
            test-results/pro
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-verification
          path: test-results/portfolio
      - name: Verify the four products and every address they inherited
        if: always()
        # Navigation is the one part of the site everything else depends on,
        # and its failures are all silent: a hash that opens nothing, a
        # destination owned by two products at once, a phone bar and a desktop
        # bar naming different things. Asserted on the rendered views.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/nav-products-browser.cjs
      - name: The site footer
        # Every tool by door at the bottom of the public pages; links open in place.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/footer-browser.cjs
      - name: Verify the stock picks lead Ideas, keep their exit line and fit a phone
        if: always()
        # Ideas answered "what should I look at?" with a picture of a planet.
        # The first pick has to be on the first screen, above the scan, with
        # its reasons and one exit price, and the record beside it has to be
        # the study's own numbers. None of that throws when it breaks.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/picks-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nav-products-verification
          path: test-results/nav-products
      - name: Verify the track record dates every idea and its return, the watchlists save, share and score, and the pulse renders
        if: always()
        # A timeline with no days on it, a rename that does not stick, a
        # shared link that opens empty, a game that never scores after the
        # close. None of them throws. The clock is pinned to an IST session.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/calls-watchlists-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calls-watchlists-verification
          path: test-results/calls-watchlists
      - name: Verify the Strategy lab sorts, compares, sizes and fits a phone
        if: always()
        # A table sorted on the wrong column, a compare tick that draws no
        # line, a calculator printing NaN, a chart spilling past a phone's
        # edge. None of them throws. The fixture is the real report shape.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/strategy-lab-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-lab-verification
          path: test-results/strategy-lab
      - name: Verify the Wealth desk sends what each form says, keeps a client's view read-only and fits a phone
        if: always()
        # A buy that loses its link to the call, a fee what-if that disagrees
        # with the bill, a sample desk that writes, a client name that runs as
        # markup, a client who can press Settle. None of them throws. The
        # fixture is the real book shape from make_wealth_fixture.py.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/wealth-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wealth-desk-verification
          path: test-results/wealth
      - name: Verify the results card shares to every network, with its logo
        if: always()
        # Four silent ones: a logo in the markup that draws nothing (or
        # vanishes on the dark theme), a network button whose address drops
        # the card's link — the only way the picture reaches X or Telegram —
        # a shared link that opens an empty results box, and a confirmation
        # that wipes the logo off the button it confirms.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/results-share-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-share-verification
          path: test-results/results-share
      - name: Verify the results calendar says only what NSE has
        if: always()
        # "Filed" must only ever mean the document is on NSE — a board that
        # has met is "not filed yet" until it arrives. Also: tab counts that
        # disagree with their rows, "today" taken from the reader's clock
        # rather than IST, a filing the morning after listed under the wrong
        # day, an address that does not open its tab, and a company name
        # rendered as markup.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/results-calendar-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-calendar-verification
          path: test-results/results-calendar
      - name: Verify only the finished homepage is ever shown while it loads
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/boot-cover-browser.cjs
      - name: Verify homepage visuals, motion and accessibility
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/home-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-browser-verification
          path: test-results/home
      - name: Verify the ownership pane does not double-count public holding
        if: always()
        # The one failure mode worth a browser for: in the exchange's format
        # Public CONTAINS the FII and DII lines, so a chart of all four
        # overstates the company by about half. This asserts on the rendered
        # bar and rows, not on the payload.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-ownership-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-browser-verification
          path: test-results/ownership
      - name: Verify WOW orders and concall digests
        if: always()
        # The two failure modes worth a browser: an order the company never
        # priced must never render as zero, and a quoted line must never
        # appear without the name of who said it.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/filings-views-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filings-views-verification
          path: test-results/filings-views
      - name: Verify Delivery trends opens on this week and reads the book only when asked
        if: always()
        # The tab carried this name for a long time while opening on a
        # one-year ranking. What a browser is for here: the lists come first,
        # a row carries its arithmetic, and the book is not fetched until
        # somebody opens it.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/delivery-trends-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-trends-verification
          path: test-results/delivery-trends
      - name: Verify the fundamentals pane never mixes accounting bases
        if: always()
        # The failure mode worth a browser for: a company files its results
        # both standalone and consolidated, the two differ by more than a
        # factor of two, and a table that alternates between them shows that
        # difference as growth while looking entirely normal. Asserted on the
        # rendered figures. Also guards the second silent one: a percentage
        # change across zero, which reports a turnaround as a collapse.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-fundamentals-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundamentals-browser-verification
          path: test-results/fundamentals
      - name: Verify investor portfolios never overstate a position
        if: always()
        # This page makes attributed, public claims about what named private
        # individuals own, so the guards are about truthfulness rather than
        # layout: a rolled-up total must always be shown broken into the filed
        # rows it was summed from, one name filed twice in a register must be
        # summed rather than collapsed, a family trust must be labelled
        # wherever it is counted, a company dropping off must never be called
        # a sale, and the 1% disclosure floor and the quarterly lag must be on
        # the page rather than in a footnote.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/investors-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investors-browser-verification
          path: test-results/investors
      - name: Verify fund house portfolios state their coverage
        if: always()
        # The failure mode for this page is looking complete when it is not:
        # AMFI lists 53 fund houses and publishes a directory rather than a
        # feed, so a page showing four of them must say so. Also guards the
        # three things the parser can get plausibly wrong — a debt holding
        # appearing as an equity position, an unmatched ISIN being dropped
        # rather than shown, and two schemes' weights being added into one
        # meaningless percentage.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/funds-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funds-browser-verification
          path: test-results/funds
      - name: Verify the opening screen is visible under every motion setting
        if: always()
        # The failure mode worth a browser for, because it has shipped twice:
        # a `both`-filled reveal held at its `from` state by a pause rule is
        # not stilled motion, it is an invisible page — and every element
        # still reports the right computed opacity, because the zero is on an
        # ancestor. This walks the masthead multiplying opacity down the tree
        # the way the compositor does, under motion on, motion off, reduced
        # motion, and with every animation on the page frozen.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/motion-off-browser.cjs
      - name: Verify a sector tile on Today opens its stocks in place
        if: always()
        # Tapping a sector used to leave Today for the market board and open
        # nothing there: the board names tiles after NSE indices, Today after
        # sectors, so the name never matched. This taps a tile at phone and
        # desktop widths and asserts the reader stays on Today with the
        # sector's stocks listed, each one a link to its page.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/today-sectors-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-sectors-browser-verification
          path: test-results/today-sectors
      - name: Verify a headline on Today opens its story
        if: always()
        # The feed calls a story's address `link` and the Headlines card read
        # `url`, so every headline was a link to "#": it underlined and went
        # nowhere, and nothing threw. This feeds the card the server's real
        # shape and taps a headline: the story opens in a new tab, no headline
        # links to "#", and one with no web address is text rather than a link.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/today-headlines-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: today-headlines-browser-verification
          path: test-results/today-headlines
      - name: Verify the delivery pane never invents a delivered figure
        if: always()
        # Two silent ones. A session the exchange published no quantity for
        # must read as an em dash: "0 delivered" is a dramatic claim about a
        # company and looks exactly like a bug. And delivered quantity is
        # DERIVED from the published share, so the page has to disclose that
        # where the number is rather than pass arithmetic off as a filing.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-delivery-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-browser-verification
          path: test-results/delivery
      - name: Verify the plain-English score explanation is lazy, labelled and escaped
        if: always()
        # It spends a small free daily allowance, so nothing may be requested
        # until the reader asks; the words must always carry the AI-written
        # label and disclaimer; and model output must render as text.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-explain-browser.cjs
      - name: Verify the header ratios print as sent and an on-request score says how it was made
        if: always()
        # Two functions named `plain` in one closure once rounded every header
        # ratio and dropped its unit. A company outside the scan is ranked on
        # request: "SCORING" until it lands, a bounded retry, then the number
        # with its provenance. A US listing says why it has no score.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-score-browser.cjs
      - name: Verify the stock page reads as one page and its score adds up on screen
        if: always()
        # The section bar sits under the name, not under a strip of badges and
        # nine figures. The points printed against each pillar sum to the
        # weighted sum under them, and that sum pulled toward 50 by the printed
        # confidence is the number on the dial. A holding period changes the
        # arithmetic without asking the API. A bank is shown no debt-to-equity.
        # Peers are named and sort; a logo is initials until a real mark loads;
        # a feed's javascript: address never becomes a link; an unanswered
        # press search is not "no news"; every section fits a phone.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-page-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-page-browser-verification
          path: test-results/stock-page
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explain-browser-verification
          path: test-results/explain
      - name: Verify sign-in failures and link completion on phone and desktop
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/signin-browser.cjs
      - name: Verify the watchlist survives signing in
        # The three ways a synced list loses somebody's work are all silent:
        # signing in replaces the list they built with an empty account, a
        # removal comes back on the next load, or a save the network dropped
        # is reported as saved. None of them throw.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/watchlist-browser.cjs
      - name: Verify the portfolio list survives a reload
        # Three silent ones: an uploaded list that lived in memory only, a lede
        # telling a signed-in reader to sign in, and a button whose answer was
        # written several screens below it.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-persist-browser.cjs
      - name: One account, two computers
        # A second computer must show the account's portfolio, and an edit
        # must reach the account without Save being pressed.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-sync-browser.cjs
      - name: Verify the holdings ledger is compact, adds up and works on a phone
        # One line per holding, under one header; a board whose totals come
        # only from the quotes given; sorting that the draft keeps; no price
        # means no estimate; a one-line signed-in strip; phone cards with no
        # sideways scroll and no button over a figure.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-ledger-browser.cjs
      - name: Verify the guided allocation card
        # Four silent ones: a slider whose figure disagrees with its handle, a
        # questionnaire that asks again for answers already given, asset
        # classes shown without a profile behind them, and rupee figures that
        # do not add up to the sum the reader put in.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/allocate-flow-browser.cjs
      - name: Verify the planner fork and the risk questionnaire
        # Somebody with no holdings must be taken to the questions rather than
        # left at an empty table, asked once rather than every visit, and shown
        # the lower of capacity and temperament rather than the flattering one.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/planner-risk-browser.cjs
      - name: Verify the money planner gives a date, keeps it, and sends nothing
        # The planner answers with a month and a year, and almost everything
        # that can go wrong with that is silent: a date that is not the one
        # the arithmetic gives, numbers gone after a reload, a what-if that
        # changes the saved plan, a purchase priced at "0 months", salary-day
        # figures a rupee out, a grade for a budget nobody itemised, a streak
        # broken by a month that is not over, an amount in the shared text or
        # in a request. The clock is pinned to an IST day.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/planner-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-verification
          path: test-results/planner
      - name: Verify the Lenses views and the Research menu
        # The LENSES column must sit in the Research menu like its neighbours,
        # a blocked lens must say "Coming soon" and never show a count, a rule
        # that could not be judged must read as a dash rather than a pass or a
        # fail, and every view must carry the notice and none of the words the
        # site's SEBI position rules out.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/lenses-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lenses-browser-verification
          path: test-results/lenses
      - name: Verify the query screener
        if: always()
        # The reader's own conditions over every stored company. Guards the
        # parts that fail quietly: a missing figure printed as 0, a bad field
        # name swallowed instead of explained, a sort that does not reach the
        # server, and a query that is lost from the address on reload.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/query-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-browser-verification
          path: test-results/query
      - name: Verify a company page reads as a company with scripts off, and still works with them on
        if: always()
        # /stock-SYMBOL is what a search engine is sent. With scripts off it
        # must show the name, the price, the filed figures and links to the
        # company's neighbours. With scripts on, the same address must be the
        # working stock page: four scripts read the company from the address,
        # and the title and canonical the server sent must be the ones that
        # stay. The pages are printed by the real renderer against the real
        # stock.html, so an edit to either that breaks the other fails here.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/company-page-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-pages-browser-verification
          path: test-results/company-pages
