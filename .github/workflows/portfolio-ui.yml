name: Portfolio UI
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/portfolio*.py'
      - 'backend/shareholding_filings.py'
      - 'backend/wow_orders.py'
      - 'backend/concalls.py'
      - 'backend/filings_text.py'
      - 'backend/tests/*portfolio*'
      - 'backend/tests/*shareholding*'
      - 'backend/tests/*wow*'
      - 'backend/tests/*concall*'
      - '.github/workflows/portfolio-ui.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          pip install numpy pandas
          npm install --prefix /tmp/portfolio-browser playwright@1.58.2
          /tmp/portfolio-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build synthetic portfolio fixtures
        run: python backend/tests/portfolio_fixture.py /tmp/portfolio-fixtures
      - name: Verify phone, tablet, desktop and chart failures
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-verification
          path: test-results/portfolio
      - name: Verify the four products and every address they inherited
        if: always()
        # Navigation is the one part of the site everything else depends on,
        # and its failures are all silent: a hash that opens nothing, a
        # destination owned by two products at once, a phone bar and a desktop
        # bar naming different things. Asserted on the rendered views.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/nav-products-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nav-products-verification
          path: test-results/nav-products
      - name: Verify homepage visuals, motion and accessibility
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/home-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-browser-verification
          path: test-results/home
      - name: Verify the ownership pane does not double-count public holding
        if: always()
        # The one failure mode worth a browser for: in the exchange's format
        # Public CONTAINS the FII and DII lines, so a chart of all four
        # overstates the company by about half. This asserts on the rendered
        # bar and rows, not on the payload.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-ownership-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-browser-verification
          path: test-results/ownership
      - name: Verify WOW orders and concall digests
        if: always()
        # The two failure modes worth a browser: an order the company never
        # priced must never render as zero, and a quoted line must never
        # appear without the name of who said it.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/filings-views-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filings-views-verification
          path: test-results/filings-views
      - name: Verify the fundamentals pane never mixes accounting bases
        if: always()
        # The failure mode worth a browser for: a company files its results
        # both standalone and consolidated, the two differ by more than a
        # factor of two, and a table that alternates between them shows that
        # difference as growth while looking entirely normal. Asserted on the
        # rendered figures. Also guards the second silent one: a percentage
        # change across zero, which reports a turnaround as a collapse.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-fundamentals-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundamentals-browser-verification
          path: test-results/fundamentals
      - name: Verify investor portfolios never overstate a position
        if: always()
        # This page makes attributed, public claims about what named private
        # individuals own, so the guards are about truthfulness rather than
        # layout: a rolled-up total must always be shown broken into the filed
        # rows it was summed from, one name filed twice in a register must be
        # summed rather than collapsed, a family trust must be labelled
        # wherever it is counted, a company dropping off must never be called
        # a sale, and the 1% disclosure floor and the quarterly lag must be on
        # the page rather than in a footnote.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/investors-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investors-browser-verification
          path: test-results/investors
      - name: Verify fund house portfolios state their coverage
        if: always()
        # The failure mode for this page is looking complete when it is not:
        # AMFI lists 53 fund houses and publishes a directory rather than a
        # feed, so a page showing four of them must say so. Also guards the
        # three things the parser can get plausibly wrong — a debt holding
        # appearing as an equity position, an unmatched ISIN being dropped
        # rather than shown, and two schemes' weights being added into one
        # meaningless percentage.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/funds-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funds-browser-verification
          path: test-results/funds
      - name: Verify the opening screen is visible under every motion setting
        if: always()
        # The failure mode worth a browser for, because it has shipped twice:
        # a `both`-filled reveal held at its `from` state by a pause rule is
        # not stilled motion, it is an invisible page — and every element
        # still reports the right computed opacity, because the zero is on an
        # ancestor. This walks the masthead multiplying opacity down the tree
        # the way the compositor does, under motion on, motion off, reduced
        # motion, and with every animation on the page frozen.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/motion-off-browser.cjs
      - name: Verify the delivery pane never invents a delivered figure
        if: always()
        # Two silent ones. A session the exchange published no quantity for
        # must read as an em dash: "0 delivered" is a dramatic claim about a
        # company and looks exactly like a bug. And delivered quantity is
        # DERIVED from the published share, so the page has to disclose that
        # where the number is rather than pass arithmetic off as a filing.
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/stock-delivery-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-browser-verification
          path: test-results/delivery
      - name: Verify sign-in failures and link completion on phone and desktop
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/signin-browser.cjs
      - name: Verify the watchlist survives signing in
        # The three ways a synced list loses somebody's work are all silent:
        # signing in replaces the list they built with an empty account, a
        # removal comes back on the next load, or a save the network dropped
        # is reported as saved. None of them throw.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/watchlist-browser.cjs
      - name: Verify the portfolio list survives a reload
        # Three silent ones: an uploaded list that lived in memory only, a lede
        # telling a signed-in reader to sign in, and a button whose answer was
        # written several screens below it.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/portfolio-persist-browser.cjs
      - name: Verify the guided allocation card
        # Four silent ones: a slider whose figure disagrees with its handle, a
        # questionnaire that asks again for answers already given, asset
        # classes shown without a profile behind them, and rupee figures that
        # do not add up to the sum the reader put in.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/allocate-flow-browser.cjs
      - name: Verify the planner fork and the risk questionnaire
        # Somebody with no holdings must be taken to the questions rather than
        # left at an empty table, asked once rather than every visit, and shown
        # the lower of capacity and temperament rather than the flattering one.
        if: always()
        env:
          NODE_PATH: /tmp/portfolio-browser/node_modules
        run: node frontend/tests/planner-risk-browser.cjs
