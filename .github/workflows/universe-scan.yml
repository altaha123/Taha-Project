name: Universe scan experience
on:
  pull_request:
    paths:
      - 'frontend/universe-scan*'
      - 'frontend/tests/nav-products-browser.cjs'
      - 'frontend/nav.js'
      - 'frontend/index.html'
      - 'backend/scan_preview.py'
      - 'backend/main.py'
      - 'backend/tests/test_scan_preview.py'
      - '.github/workflows/universe-scan.yml'
permissions:
  contents: read
jobs:
  scan-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest --noconftest backend/tests/test_scan_preview.py -q
      - run: node --test frontend/universe-scan.test.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node frontend/tests/nav-products-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-scan-browser-screenshots
          path: test-results/nav-products
          if-no-files-found: ignore
