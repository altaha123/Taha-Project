name: Universe scan experience
on:
  pull_request:
    paths:
      - 'frontend/universe-scan*'
      - 'frontend/tests/nav-products-browser.cjs'
      - 'frontend/nav.js'
      - 'frontend/index.html'
      - 'backend/scan_preview.py'
      - 'backend/main.py'
      - 'backend/tests/test_scan_preview.py'
      - '.github/workflows/universe-scan.yml'
      - '.github/scripts/install-chromium.sh'
permissions:
  contents: read
jobs:
  scan-experience:
    # Pinned, not ubuntu-latest: the day that label moved to Ubuntu 26.04,
    # Playwright 1.58.2 refused to install Chromium there and this job
    # failed before running a single test. Move this and the Playwright
    # version together.
    runs-on: ubuntu-24.04
    # The steps take about two minutes. The limit is for the browser install:
    # install-chromium.sh gives a slow package mirror three attempts, eleven
    # minutes at the very worst. At ten, one slow mirror cancelled this job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest --noconftest backend/tests/test_scan_preview.py -q
      - run: node --test frontend/universe-scan.test.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: bash .github/scripts/install-chromium.sh node_modules/.bin/playwright
      - run: node frontend/tests/nav-products-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-scan-browser-screenshots
          path: test-results/nav-products
          if-no-files-found: ignore
