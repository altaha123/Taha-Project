name: Fill the fundamentals tables

# Every listed company's income statement, balance sheet and cash flow, read
# from its Regulation 33 filings into three tables (altaha_fundamentals.db on
# the API's disk). Same shape as the holdings ledger workflow: the crawl runs
# ON THE API, where the disk is, and this job only keeps asking for the next
# bounded slice. The first read of a company is ~34 documents (back to 2018);
# after that each company is re-read once a fortnight, fetching only new
# filings.
#
# WHEN IT RUNS: AROUND THE CLOCK
# A run every six hours, each lasting up to about six (GitHub's limit for one
# job), queued behind the last so two never crawl at once. During market hours
# (09:00–15:45 IST, weekdays) it keeps going but waits a minute between slices
# instead of five seconds: the instance is 512 MB and half a CPU and serves the
# live site, and the crawl reaches NSE from the same address as the live
# features. The crawler itself also backs off when NSE starts refusing.
#
# Needs the same repository secret as the holdings workflow: ALTAHA_ADMIN_KEY.

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # every six hours, around the clock
  workflow_dispatch:
    inputs:
      slices:
        description: "The most crawl calls to make (8 companies each)"
        type: string
        default: "200"

permissions:
  contents: read

concurrency:
  group: fundamentals-table
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Read the next slices of companies into the tables
        timeout-minutes: 300
        env:
          ADMIN_KEY: ${{ secrets.ALTAHA_ADMIN_KEY }}
          API: https://taha-project.onrender.com
          SLICES: ${{ inputs.slices || '200' }}
        run: |
          set -uo pipefail
          # Market hours: keep crawling, but give the live site room.
          market() {
            local now dow
            now=$((10#$(TZ=Asia/Kolkata date +%H%M))); dow=$(TZ=Asia/Kolkata date +%u)
            [ "${dow}" -le 5 ] && [ "${now}" -ge 900 ] && [ "${now}" -lt 1545 ]
          }
          if [ -z "${ADMIN_KEY}" ]; then
            echo "::error::ALTAHA_ADMIN_KEY is not set. Add it under Settings → Secrets and variables → Actions, with the same value as ADMIN_KEY on Render."
            exit 1
          fi
          curl -sS --max-time 120 --retry 3 --retry-delay 10 \
               --retry-all-errors -o /dev/null "${API}/health" || true

          failed=0; rows=0
          for i in $(seq 1 "${SLICES}"); do
            code=$(curl -sS --max-time 1500 -o slice.json -w "%{http_code}" \
                   -X POST "${API}/admin/fundamentals/crawl?limit=8" \
                   -H "X-Admin-Key: ${ADMIN_KEY}" || echo "000")
            if [ "${code}" != "200" ]; then
              echo "slice ${i}: HTTP ${code}"
              if [ "${code}" = "401" ]; then
                echo "::error::The server rejected the admin key (401). ALTAHA_ADMIN_KEY does not match ADMIN_KEY on Render."
                exit 1
              fi
              failed=$((failed + 1))
              # 502, 503 and no answer at all are what a Render deploy looks
              # like: the instance restarts for a few minutes. Every merge
              # deploys, so give it twelve minutes before calling the API
              # down — three strikes at thirty seconds ended a run that had
              # been reading happily for an hour, and nothing crawled again
              # until the next scheduled start.
              case "${code}" in
                502|503|504|000) limit=12 ;;
                *)               limit=3 ;;
              esac
              if [ "${failed}" -ge "${limit}" ]; then
                echo "::error::${failed} slices in a row failed (last HTTP ${code}) — stopping."
                exit 1
              fi
              sleep 60
              continue
            fi
            failed=0
            read -r attempted got early < <(python3 -c "import json;d=json.load(open('slice.json'));print(d.get('attempted',0), d.get('rows',0), (d.get('stopped_early') or '').replace(' ','_'))")
            rows=$((rows + got))
            echo "slice ${i}: ${attempted} companies, ${got} rows ${early:+— ${early}}"
            if [ "${attempted}" = "0" ]; then
              echo "nothing further is due — the table is current."
              break
            fi
            if [ -n "${early}" ] || market; then sleep 60; else sleep 5; fi
          done
          echo "::notice::${rows} rows written."

      - name: Read the next slices of companies from Yahoo Finance
        # A second opinion in its own table, on its own queue, so a Yahoo
        # outage never stalls the exchange sweep.
        continue-on-error: true
        timeout-minutes: 50
        env:
          ADMIN_KEY: ${{ secrets.ALTAHA_ADMIN_KEY }}
          API: https://taha-project.onrender.com
          SLICES: "15"
        run: |
          set -uo pipefail
          # Market hours: keep crawling, but give the live site room.
          market() {
            local now dow
            now=$((10#$(TZ=Asia/Kolkata date +%H%M))); dow=$(TZ=Asia/Kolkata date +%u)
            [ "${dow}" -le 5 ] && [ "${now}" -ge 900 ] && [ "${now}" -lt 1545 ]
          }
          failed=0
          for i in $(seq 1 "${SLICES}"); do
            code=$(curl -sS --max-time 900 -o yslice.json -w "%{http_code}" \
                   -X POST "${API}/admin/fundamentals/crawl?source=yfinance&limit=30" \
                   -H "X-Admin-Key: ${ADMIN_KEY}" || echo "000")
            if [ "${code}" != "200" ]; then
              echo "yahoo slice ${i}: HTTP ${code}"
              failed=$((failed + 1))
              if [ "${failed}" -ge 3 ]; then echo "::warning::three Yahoo slices failed — stopping."; exit 0; fi
              sleep 30; continue
            fi
            failed=0
            read -r attempted got early < <(python3 -c "import json;d=json.load(open('yslice.json'));print(d.get('attempted',0), d.get('rows',0), (d.get('stopped_early') or '').replace(' ','_'))")
            echo "yahoo slice ${i}: ${attempted} companies, ${got} values ${early:+— ${early}}"
            if [ "${attempted}" = "0" ]; then echo "nothing further is due from Yahoo."; break; fi
            if [ -n "${early}" ]; then sleep 120; elif market; then sleep 60; else sleep 5; fi
          done

      - name: Check the tables against accounting identities
        # Quarters add up to the year, the balance sheet balances, PAT
        # reconciles — see backend/fundamentals_checks.py. Seconds, and it
        # reflects whatever this run added.
        if: always()
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ALTAHA_ADMIN_KEY }}
          API: https://taha-project.onrender.com
        run: |
          curl -sS --max-time 300 -X POST "${API}/admin/fundamentals/checks" \
               -H "X-Admin-Key: ${ADMIN_KEY}" -o checks.json || exit 0
          python3 - <<'PY' || true
          import json
          d = json.load(open("checks.json"))
          for c in d.get("checks", []):
              print("%-24s %-11s tested %7s  major %5s  minor %5s  warnings %4s  pass %s%%"
                    % (c["id"], c["kind"], c["tested"], c["major"], c["minor"],
                       c["warnings"], c["pass_pct"]))
          print("identity checks passing: %s%% of %s; companies with a major gap: %s"
                % (d.get("identity_pass_pct"), d.get("identity_tests"), d.get("companies_with_major")))
          PY

      - name: Report what the table now holds
        if: always()
        env:
          API: https://taha-project.onrender.com
        run: |
          curl -sS --max-time 120 "${API}/fundamentals/coverage" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); st=d.get('store') or {}
          print('universe  : %s companies' % d.get('universe'))
          for name, t in (st.get('tables') or {}).items():
              print('%-17s %s companies, %s rows, %s to %s' % (name, t.get('companies'),
                    t.get('rows'), t.get('earliest_period'), t.get('latest_period')))
          print('coverage  : %s' % st.get('coverage'))
          print('yahoo     : %s' % st.get('yfinance'))
          if not st.get('persistent'):
              print('::warning::the table is NOT on a persistent disk — check DATA_DIR on Render.')
          " || true
