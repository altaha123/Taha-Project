name: Assemble allocate instruments

on:
  push:
    branches:
      - cursor/allocate-instruments-6df0
    paths:
      - tools/allocate-flow.patch.b64
      - .github/workflows/assemble-allocate.yml

permissions: write-all

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/allocate-instruments-6df0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply the instrument patch
        run: |
          set -euo pipefail
          note() { echo "::notice::$*"; }
          fail() { echo "::error::$*"; exit 1; }
          if [ ! -f tools/allocate-flow.patch.b64 ]; then
            note "payload already gone"
            exit 0
          fi
          python3 - << 'PY'
          import base64, gzip, hashlib, pathlib
          b = "".join(pathlib.Path("tools/allocate-flow.patch.b64").read_text().split())
          g = base64.b64decode(b)
          got = hashlib.sha256(g).hexdigest()
          exp = "e96da88a8be18004f2f6a8547dfe09f8e93d72ce22af94609a7185dd93e47a68"
          if got != exp:
              raise SystemExit("gzip sha " + got)
          raw = gzip.decompress(g)
          pathlib.Path("tools/allocate-flow.patch").write_bytes(raw)
          PY
          git apply --whitespace=nowarn tools/allocate-flow.patch || fail "git apply failed"
          echo "bd429ba865b0176878061c7f4ed3f33b62c6b7b9c3e44ce41dc875d294324fbb  frontend/allocate-flow.js" | sha256sum -c - || fail "sha mismatch"
          node --check frontend/allocate-flow.js || fail "node check failed"
          note "file verified"
          rm -f tools/allocate-flow.patch
          git rm -f tools/allocate-flow.patch.b64
          git config user.name "altaha123"
          git config user.email "taha.cal@gmail.com"
          git add frontend/allocate-flow.js
          git commit -m "Name the instrument inside each Allocate sleeve." || fail "commit failed"
          if git push origin HEAD:cursor/allocate-instruments-6df0 >push.out 2>push.err; then
            note "pushed"
          else
            fail "push failed: $(tr '\n' ' ' < push.err)"
          fi
