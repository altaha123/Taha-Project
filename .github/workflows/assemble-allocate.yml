name: Assemble allocate instruments

on:
  push:
    branches:
      - cursor/allocate-instruments-6df0
    paths:
      - tools/allocate-flow.patch.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/allocate-instruments-6df0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply the instrument patch
        run: |
          set -euo pipefail
          if [ ! -f tools/allocate-flow.patch.b64 ]; then
            echo "payload already gone"
            exit 0
          fi
          python3 - << 'PY'
          import base64, gzip, hashlib, pathlib
          b = "".join(pathlib.Path("tools/allocate-flow.patch.b64").read_text().split())
          g = base64.b64decode(b)
          assert hashlib.sha256(g).hexdigest() == "e96da88a8be18004f2f6a8547dfe09f8e93d72ce22af94609a7185dd93e47a68", hashlib.sha256(g).hexdigest()
          raw = gzip.decompress(g)
          assert hashlib.sha256(raw).hexdigest() == "f29839de8bdca62d38e883184d91c86d5e994b98509d99f2713e9db2868e1d8a"
          pathlib.Path("tools/allocate-flow.patch").write_bytes(raw)
          PY
          git apply --whitespace=nowarn tools/allocate-flow.patch
          echo "bd429ba865b0176878061c7f4ed3f33b62c6b7b9c3e44ce41dc875d294324fbb  frontend/allocate-flow.js" | sha256sum -c -
          node --check frontend/allocate-flow.js
          git rm -f tools/allocate-flow.patch.b64 tools/allocate-flow.patch .github/workflows/assemble-allocate.yml
          git config user.name "altaha123"
          git config user.email "taha.cal@gmail.com"
          git add frontend/allocate-flow.js
          git commit -m "Name the instrument inside each Allocate sleeve."
          git push origin HEAD:cursor/allocate-instruments-6df0
