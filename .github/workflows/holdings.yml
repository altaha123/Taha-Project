name: Fill the holdings ledger

# WHAT THIS IS FOR
# The investor and fund-house portfolio pages are assembled from a ledger, and
# the ledger is built by reading filings one company at a time. Nothing else
# fills it. Without this workflow both pages are correct, tested, and empty —
# which is exactly how they shipped, and exactly what a reader sees as a bug.
#
# WHY A WORKFLOW AND NOT A TIMER
# Same reasoning as the daily digest. Render's cron is a separate paid service,
# and an in-process timer dies with the worker — on a 512 MB instance that
# restarts, a timer is a job that quietly stops one afternoon and nobody
# notices for a fortnight. A workflow is versioned, its history is visible, and
# a failed run is an email from GitHub rather than silence.
#
# HOW THE WORK IS DIVIDED
# The crawl runs ON THE API, not here, because the ledger lives on the disk
# mounted to the API. This job's only role is to keep asking for the next
# slice. Each call is bounded — the instance has half a CPU and NSE throttles
# bursts — so a sweep of ~2,300 companies is many calls across many runs, and
# the coverage table is what makes each call continue the last rather than
# start it again.
#
# CADENCE. Shareholding patterns are filed quarterly, within 21 days of quarter
# end, and monthly fund portfolios are due by the tenth. Nightly is far more
# often than either changes — but a night's slice is a few hundred companies,
# so frequent small runs are how the sweep finishes at all. Once the ledger is
# full each night's run is nearly all no-ops, which costs one API call per
# slice and nothing else.
#
# Needs one repository secret: ALTAHA_ADMIN_KEY, the same value as ADMIN_KEY on
# Render. Settings → Secrets and variables → Actions.

on:
  schedule:
    # 20:30 UTC = 02:00 IST. Well clear of market hours and of the digest.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      slices:
        description: "How many crawl calls to make (40 companies each)"
        type: string
        default: "20"
      quarters:
        description: "Quarters to read per company"
        type: string
        default: "2"
      funds:
        description: "Also read the fund houses' monthly packs"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Two runs crawling at once would double the request rate at NSE, which is
  # the one thing guaranteed to get the instance blocked.
  group: holdings-ledger
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Read the next slices of companies into the ledger
        env:
          ADMIN_KEY: ${{ secrets.ALTAHA_ADMIN_KEY }}
          API: https://taha-project.onrender.com
          SLICES: ${{ inputs.slices || '20' }}
          QUARTERS: ${{ inputs.quarters || '2' }}
        run: |
          set -uo pipefail
          if [ -z "${ADMIN_KEY}" ]; then
            echo "::error::ALTAHA_ADMIN_KEY is not set, so this job cannot ask the API to do anything. Add it under Settings → Secrets and variables → Actions, with the same value as ADMIN_KEY on Render. Until then the investor and fund-house pages stay empty, and the daily digest cannot send either — it uses the same secret."
            exit 1
          fi

          # A free-tier instance can be asleep and the first request pays for
          # waking it. Warm it rather than counting a cold start as a failure.
          curl -sS --max-time 120 --retry 3 --retry-delay 10 \
               --retry-all-errors -o /dev/null "${API}/health" || true

          # A ledger collected before the quarter-end guard can carry rows
          # filed under an interim date, and one of those is enough to make
          # every "current quarter" question return a period a single company
          # filed for. A no-op once the ledger is clean.
          curl -sS --max-time 300 -o repair.json \
               -X POST "${API}/admin/holdings/repair" \
               -H "X-Admin-Key: ${ADMIN_KEY}" || true
          cat repair.json 2>/dev/null; echo

          ok=0; failed=0; rows=0
          for i in $(seq 1 "${SLICES}"); do
            code=$(curl -sS --max-time 900 -o slice.json -w "%{http_code}" \
                   -X POST "${API}/admin/holdings/crawl?limit=40&quarters=${QUARTERS}" \
                   -H "X-Admin-Key: ${ADMIN_KEY}" || echo "000")

            if [ "${code}" != "200" ]; then
              echo "slice ${i}: HTTP ${code}"
              # 401 is not a transient failure and retrying it twenty times
              # teaches nobody anything. The secret EXISTS — the guard above
              # would have caught an empty one — so the value simply does not
              # match ADMIN_KEY on the server, which is the single most likely
              # thing to be wrong here and deserves saying in those words.
              if [ "${code}" = "401" ]; then
                echo "::error::The server rejected the admin key (401). ALTAHA_ADMIN_KEY is set on this repository but its value does not match ADMIN_KEY on Render. Copy the value from the Render dashboard (Environment tab) into Settings → Secrets and variables → Actions, taking care not to include a trailing space or newline. You can also fill the ledger without any secret at all, from the Fill the ledger panel at the bottom of the Investor portfolios page."
                exit 1
              fi
              failed=$((failed + 1))
              # Three consecutive failures means the instance is down.
              # Continuing would just be twenty more of the same.
              if [ "${failed}" -ge 3 ]; then
                echo "::error::three slices in a row failed (last HTTP ${code}) — stopping."
                exit 1
              fi
              sleep 30
              continue
            fi

            failed=0
            got=$(python3 -c "import json;d=json.load(open('slice.json'));print(d.get('rows',0))")
            attempted=$(python3 -c "import json;d=json.load(open('slice.json'));print(d.get('attempted',0))")
            early=$(python3 -c "import json;d=json.load(open('slice.json'));print(d.get('stopped_early') or '')")
            rows=$((rows + got)); ok=$((ok + 1))
            echo "slice ${i}: ${attempted} companies, ${got} rows ${early:+— ${early}}"

            # Nothing left due: the sweep has caught up with itself.
            if [ "${attempted}" = "0" ]; then
              echo "nothing further is due — the ledger is current."
              break
            fi
            # The crawler stops a slice early when the exchange starts
            # refusing. Backing off is the whole point of it saying so.
            if [ -n "${early}" ]; then sleep 60; else sleep 5; fi
          done

          echo "::notice::${ok} slices, ${rows} new rows."

      - name: Read the fund houses' monthly portfolios
        # A boolean input compared with the string 'false' is never equal, so
        # the old condition ran this step even when the box was unticked.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.funds }}
        continue-on-error: true       # the investor ledger is the primary job;
                                      # the summary below is what fails loudly
        env:
          ADMIN_KEY: ${{ secrets.ALTAHA_ADMIN_KEY }}
          API: https://taha-project.onrender.com
        run: |
          set -uo pipefail
          # Each pack is a ~15 MB download parsed on a 512 MB instance, so
          # these are taken four at a time with a pause between. The API keeps
          # a cursor, so each call continues the last — before it did, every
          # call read the same first four AMCs of the directory and the other
          # fifty-one were never attempted. It stops when nothing is due.
          echo '{"attempted": 0, "ok": 0, "rows": 0, "slices": 0, "failed": []}' > funds-run.json
          for i in $(seq 1 16); do
            code=$(curl -sS --max-time 900 -o funds.json -w "%{http_code}" \
                   -X POST "${API}/admin/funds/ingest?limit=4" \
                   -H "X-Admin-Key: ${ADMIN_KEY}" || echo "000")
            if [ "${code}" != "200" ]; then
              echo "fund slice ${i}: HTTP ${code}"; sleep 20; continue
            fi
            python3 - <<'PY'
          import json
          d = json.load(open("funds.json"))
          run = json.load(open("funds-run.json"))
          run["slices"] += 1
          for k in ("attempted", "ok", "rows"):
              run[k] += int(d.get(k) or 0)
          print("fund slice: %d attempted, %d read, %d rows, %s still due for %s"
                % (d.get("attempted", 0), d.get("ok", 0), d.get("rows", 0),
                   d.get("remaining", "?"), d.get("want_month")), flush=True)
          for r in d.get("results", []):
              mark = "ok" if r.get("ok") else "--"
              line = (r.get("as_of") or "") if r.get("ok") else (r.get("note") or "")
              print("   %s %s: %s" % (mark, r.get("name"), line[:160]), flush=True)
              if not r.get("ok"):
                  run["failed"].append({"name": r.get("name"), "note": r.get("note")})
          if d.get("note") and not d.get("attempted"):
              print("   " + d["note"])
          json.dump(run, open("funds-run.json", "w"))
          open("funds-attempted.txt", "w").write(str(int(d.get("attempted") or 0)))
          PY
            if [ "$(cat funds-attempted.txt 2>/dev/null || echo 0)" = "0" ]; then
              echo "nothing further is due."
              break
            fi
            sleep 15
          done

      - name: Report what the ledger now holds
        if: always()
        env:
          API: https://taha-project.onrender.com
          FUNDS: ${{ github.event_name != 'workflow_dispatch' || inputs.funds }}
        run: |
          set -uo pipefail
          curl -sS --max-time 120 -o coverage.json "${API}/investors/coverage" || echo '{}' > coverage.json
          python3 - <<'PY'
          import json, os, sys
          try:
              d = json.load(open("coverage.json"))
          except Exception:
              d = {}
          st = d.get("store", {}) or {}
          funds = st.get("funds", {}) or {}
          universe = d.get("universe")
          read = st.get("companies", 0)
          print("companies read : %s%s" % (read, " of %s" % universe if universe else ""))
          print("holder rows    : %s" % st.get("rows", 0))
          print("distinct names : %s" % st.get("holders", 0))
          print("latest quarter : %s" % st.get("latest_period"))
          print("fund houses    : %s (%s positions, %s)"
                % (funds.get("amcs", 0), funds.get("rows", 0),
                   funds.get("latest_month")))
          if d and not st.get("persistent"):
              print("::warning::the ledger is NOT on a persistent disk — "
                    "everything collected is lost on the next deploy. "
                    "Check DATA_DIR on Render.")
          aliases = d.get("aliases") or {}
          if aliases.get("unmatched"):
              print("::notice::%d tracked aliases have never matched a filing. "
                    "Either the crawl has not reached those companies yet, or "
                    "the spelling in investors.py is wrong."
                    % len(aliases["unmatched"]))

          # FUND HOUSES: fail loudly. Fourteen nightly runs reported success
          # while reading zero AMCs, because nothing here looked. Now: a ledger
          # with no fund house in it fails the job, and so does a run that
          # tried houses and read none of them when the ledger cannot be
          # checked.
          if os.environ.get("FUNDS") != "true":
              sys.exit(0)
          try:
              run = json.load(open("funds-run.json"))
          except Exception:
              run = None
          if run is not None:
              print("this run       : %d fund houses tried, %d read, %d rows"
                    % (run["attempted"], run["ok"], run["rows"]))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary and run is not None:
              with open(summary, "a") as fh:
                  fh.write("### Fund houses\n\n%s in the ledger (latest month %s); "
                           "this run tried %d and read %d.\n\n"
                           % (funds.get("amcs", "unknown"), funds.get("latest_month"),
                              run["attempted"], run["ok"]))
                  if run["failed"]:
                      fh.write("| Fund house | Why it was not read |\n|---|---|\n")
                      for f in run["failed"]:
                          fh.write("| %s | %s |\n" % (f["name"],
                                   (f["note"] or "").replace("|", "/")[:200]))
          ledger = funds.get("amcs") if "amcs" in funds else None
          if ledger == 0:
              print("::error::0 fund houses have been read into the ledger. "
                    "The fund-house page is empty. See the per-AMC reasons in "
                    "the step above and in this run's summary.")
              sys.exit(1)
          if ledger is None and run is not None and run["attempted"] and not run["ok"]:
              print("::error::%d fund houses were tried and none was read, and "
                    "the ledger's coverage could not be checked."
                    % run["attempted"])
              sys.exit(1)
          if run is not None and run["attempted"] and not run["ok"]:
              print("::warning::%d fund houses were due and none was read this "
                    "run." % run["attempted"])
          PY
